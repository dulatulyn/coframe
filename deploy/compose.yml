name: coframe

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coframe
      POSTGRES_USER: coframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coframe -d coframe"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://coframe:${POSTGRES_PASSWORD}@db:5432/coframe
      PUBLIC_APP_URL: https://${DOMAIN:?}
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        API_URL: http://api:8100
    restart: unless-stopped
    environment:
      API_URL: http://api:8100
    depends_on:
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: coframe
      PGDATABASE: coframe
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_EVERY: ${BACKUP_EVERY:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ${BACKUP_DIR:-../../backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 90
        while true; do
          name="/backups/coframe-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump --format=custom --file="$$name.partial" && mv "$$name.partial" "$$name"; then
            echo "backup written: $$name"
          else
            rm -f "$$name.partial"
            echo "backup failed" >&2
          fi
          ls -1t /backups/coframe-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_EVERY"
        done

  caddy:
    build: ./caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  db:
  caddy_data:
  caddy_config:
