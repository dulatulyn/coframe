[project]
name = "coframe-api"
version = "0.1.0"
description = "Coframe API: collaborative BPMN modeling"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi[standard]>=0.142",
    "lxml>=5",
    "pwdlib[argon2]>=0.3",
    "pycrdt>=0.14.8",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx-ws>=0.9.0",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pycrdt.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "ASYNC109"]
"tests/conftest.py" = ["E402"]
"migrations/env.py" = ["E402"]
